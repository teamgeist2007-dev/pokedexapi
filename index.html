<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pokédex</h1>

    <main>
        <p id="loading">Loading Pokémon...</p>
        <ul id="pokemon-list"></ul>

        <div class="load-more-container">
            <button id="load-more-button" onclick="loadPokemon()">
                Weitere 20 laden
            </button>
        </div>
    </main>

    <dialog id="pokemon-dialog" onclose="document.body.style.overflow = ''">
        <div id="dialog-content"></div>

        <div class="dialog-buttons">
            <button onclick="previousPokemon()">←</button>
            <button onclick="closeDialog()">Schließen</button>
            <button onclick="nextPokemon()">→</button>
        </div>
    </dialog>
</body>

</html>
