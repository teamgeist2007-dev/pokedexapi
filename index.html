<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="icon" href="assets/icon/PokemonIcon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <img class="logo" src="assets/icon/PokemonIcon.svg" alt="Pokéball">
        <h1>Pokédex</h1>
    </header>

    <div class="search-container">
        <input id="search-input" type="search" placeholder="Pokémon suchen" oninput="renderPokemon()">
    </div>

    <main>
        <p id="loading"></p>

        <div id="loading-animation" hidden>
            <span class="spinner"></span>
            <p>Pokémon werden geladen...</p>
        </div>

        <ul id="pokemon-list"></ul>

        <div class="load-more-container">
            <button id="load-more-button" onclick="loadPokemon()">
                Weitere 20 laden
            </button>
        </div>
    </main>

    <dialog id="pokemon-dialog" onclick="closeOutside(event)" onclose="document.body.style.overflow = ''">

        <div id="dialog-content"></div>

        <div class="dialog-buttons">
            <button onclick="previousPokemon()">←</button>
            <button onclick="closeDialog()">Schließen</button>
            <button onclick="nextPokemon()">→</button>
        </div>
    </dialog>
</body>

</html>
