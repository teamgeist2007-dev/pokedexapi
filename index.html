<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Pokédex</h1>

    <main>
        <p id="loading">Loading Pokémon...</p>
        <ul id="pokemon-list"></ul>

    <dialog id="pokemon-dialog" aria-label="Pokémon details">
        <button onclick="closeDialog()" aria-label="Close details">Close</button>
        <div id="dialog-content"></div>
    </dialog>

</body>

</html>
